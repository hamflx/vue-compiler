name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cargo-test-workspace.log"
          cargo test --workspace 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) {
            exit 0
          }

          $lines = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
          $patterns = @(
            "FAILED",
            "failures:",
            "panicked at",
            "thread '",
            "assertion failed",
            "error: test failed",
            "test result: FAILED"
          )
          $matches = @(
            $lines | Where-Object {
              $line = $_
              $patterns | Where-Object { $line.Contains($_) } | Select-Object -First 1
            } | Select-Object -Last 120
          )
          $tail = @($lines | Select-Object -Last 80)
          $summaryLines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in @(
            "cargo test --workspace failed on $env:RUNNER_OS/$env:RUNNER_ARCH with exit code $exitCode",
            "rustc: $(rustc --version)",
            "cargo: $(cargo --version)",
            "node: $(node --version)",
            "",
            "Matched failure lines:"
          )) {
            [void]$summaryLines.Add($line)
          }
          if ($matches.Count -eq 0) {
            [void]$summaryLines.Add("<none>")
          } else {
            foreach ($line in $matches) {
              [void]$summaryLines.Add([string]$line)
            }
          }
          [void]$summaryLines.Add("")
          [void]$summaryLines.Add("Last log lines:")
          if ($tail.Count -eq 0) {
            [void]$summaryLines.Add("<none>")
          } else {
            foreach ($line in $tail) {
              [void]$summaryLines.Add([string]$line)
            }
          }
          $summary = ($summaryLines -join "`n").Trim()
          if ($summary.Length -gt 30000) {
            $summary = $summary.Substring($summary.Length - 30000)
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            @(
              "## Rust workspace tests failed",
              "",
              '```text',
              $summary,
              '```'
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          $escaped = $summary.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Host "::error title=Rust workspace tests failed::$escaped"
          exit $exitCode

      - name: Verify official lock
        run: cargo xtask verify-official-lock

      - name: Sync official tests
        run: cargo xtask sync-official-tests --locked

      - name: Verify vendored lock
        run: cargo xtask verify-official-lock --require-vendor

      - name: Verify generated alias API
        run: |
          cargo xtask export-api --all
          cargo xtask diff-api --all

      - name: Verify option and output contracts
        run: |
          cargo xtask generate-option-matrix --all
          cargo xtask audit-option-matrix --all
          cargo xtask run-option-matrix --all
          cargo xtask run-output-contract --all

      - name: Verify generated alias conformance
        run: |
          cargo xtask verify-npm-alias --all
          cargo xtask run-conformance --all

      - name: Verify NAPI package aliases
        run: |
          cargo xtask verify-napi
          cargo xtask verify-napi-alias
          cargo xtask verify-napi-api
          cargo xtask verify-napi-platform
          cargo xtask run-napi-option-matrix --all
          cargo xtask run-napi-output-contract --all
          cargo xtask run-napi-conformance --all

  product-smoke:
    name: Product Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify CLI and release metadata
        run: |
          cargo xtask verify-cli
          cargo xtask bench
          cargo xtask verify-incremental
          cargo xtask verify-parallel
          cargo xtask verify-ast-cache
          cargo xtask verify-arena
          cargo xtask verify-string-interning
          cargo xtask verify-release-docs
          cargo xtask verify-public-api-docs
          cargo xtask verify-crate-metadata
          cargo xtask verify-supply-chain

  release-smoke:
    name: Release Install Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install WASM release tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Verify current platform release install smoke
        run: cargo xtask verify-release-install-smoke --current-platform-only

      - name: Stage current native artifact
        shell: pwsh
        run: |
          $key = "${{ runner.os }}-${{ runner.arch }}"
          $suffix = switch ($key) {
            "Linux-X64" { "linux-x64-gnu" }
            "Linux-ARM64" { "linux-arm64-gnu" }
            "macOS-X64" { "darwin-x64" }
            "macOS-ARM64" { "darwin-arm64" }
            "Windows-X64" { "win32-x64" }
            "Windows-ARM64" { "win32-arm64" }
            default { throw "Unsupported release artifact platform $key" }
          }
          $source = if ($IsWindows) {
            "target/release/vuec_napi.dll"
          } elseif ($IsMacOS) {
            "target/release/libvuec_napi.dylib"
          } else {
            "target/release/libvuec_napi.so"
          }
          $target = "target/native-artifacts/$suffix/vuec_napi.node"
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Copy-Item -LiteralPath $source -Destination $target

      - name: Upload current native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: target/native-artifacts/**/vuec_napi.node
          if-no-files-found: error

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    needs: release-smoke
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install WASM release tooling
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: target/native-artifacts
          merge-multiple: false

      - name: Verify release dry-run with native artifacts
        run: cargo xtask verify-release-dry-run --native-artifacts-dir target/native-artifacts
