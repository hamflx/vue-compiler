schema_version = 1
min_projects = 15
min_vue_files_per_project = 20

# External Vue 2.6-compatible production-corpus projects are fixed here by
# repository and commit before running `cargo xtask verify-vue2-project-corpus`.
#
# Each project must be a public medium-sized Vue 2 application/library with a
# package manifest declaring Vue 2.6 directly or a semver range that covers the
# pinned Vue 2.6 target. The comparison still uses the official Vue 2.7 compiler
# package boundary because Vue 2.7 is the official compiler line that supports
# compiling Vue 2.6 projects.
#
# Use include/exclude rules to keep dependency, build, and coverage output out
# of the corpus while selecting at least 20 real SFC files per project.

[[projects]]
name = "ElemeFE-element"
repo = "https://github.com/ElemeFE/element.git"
rev = "c345bb453bf11badb4831a6a3f600c9372b3a336"
package_json = "package.json"
submodules = false
include = ["packages/*.vue", "examples/*.vue"]
exclude = ["**/node_modules/**", "**/dist/**", "**/coverage/**", "**/lib/**", "**/es/**", "examples/components/theme/loader/**"]

