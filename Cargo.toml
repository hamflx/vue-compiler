[workspace]
resolver = "2"
members = [
  "crates/vuec_ast",
  "crates/vuec_codegen",
  "crates/vuec_html",
  "crates/vuec_js",
  "crates/vuec_pass",
  "crates/vuec_diagnostics",
  "crates/vuec_sfc",
  "crates/vuec_style",
  "crates/vuec_vue2",
  "crates/vuec_vue3_asset",
  "crates/vuec_vue3_dom",
  "crates/vuec_vue3_core",
  "crates/vuec_vue3_ssr",
  "crates/vuec_source",
  "crates/vuec_bridge_registry",
  "crates/vuec_node_bridge",
  "crates/vuec_cli",
  "crates/vuec_napi",
  "crates/vuec_wasm",
  "crates/vuec_runtime_tests",
  "xtask",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
version = "0.1.0"
repository = "https://github.com/hamflx/vue-compiler"
homepage = "https://github.com/hamflx/vue-compiler"
keywords = ["vue", "compiler", "sfc", "template", "rust"]
categories = ["compilers", "development-tools", "web-programming"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
napi = { version = "3.9.0", features = ["serde-json"] }
napi-derive = "3.5.6"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1"
wee_alloc = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
nodejs-semver = "4.2.0"
sha2 = "0.10"
sysinfo = "0.39.2"
thiserror = "2"
toml = "0.8"
grass = { version = "0.13.4", default-features = false }
tempfile = "3"
oxc_allocator = "0.132.0"
oxc_ast = "0.132.0"
oxc_diagnostics = "0.132.0"
oxc_parser = "0.132.0"
oxc_sourcemap = "6.1.1"
oxc_span = "0.132.0"
