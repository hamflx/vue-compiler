[workspace]
resolver = "2"
members = [
  "crates/vuec_ast",
  "crates/vuec_codegen",
  "crates/vuec_html",
  "crates/vuec_js",
  "crates/vuec_pass",
  "crates/vuec_diagnostics",
  "crates/vuec_sfc",
  "crates/vuec_style",
  "crates/vuec_vue2",
  "crates/vuec_vue3_asset",
  "crates/vuec_vue3_dom",
  "crates/vuec_vue3_core",
  "crates/vuec_vue3_ssr",
  "crates/vuec_source",
  "crates/vuec_node_bridge",
  "crates/vuec_cli",
  "crates/vuec_napi",
  "crates/vuec_runtime_tests",
  "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
napi = { version = "3.9.0", features = ["serde-json"] }
napi-derive = "3.5.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
oxc_allocator = "0.132.0"
oxc_ast = "0.132.0"
oxc_diagnostics = "0.132.0"
oxc_parser = "0.132.0"
oxc_sourcemap = "6.1.1"
oxc_span = "0.132.0"
